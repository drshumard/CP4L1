    function e_g_purchase(){
        try {
            var user_data = JSON.parse(localStorage.getItem('_ud'));
            var session_data = JSON.parse(localStorage.getItem('v2_history_'+ user_data.location_id));
            var order_data = JSON.parse(localStorage.getItem('_pl_'+ session_data.sessions[0].funnel.id));
            var contents = [];
            order_data.products.forEach(function(product) {
                contents.push({
                    id: product._id,
                    quantity: product.quantity.max,
                    item_price: product.price.amount
                });
            });
            console.log("Contents:", contents);
            var eg_data = {
                transaction_id: order_data.orderIds[0],
                value: order_data.total,
                currency: order_data.products[0].price.currency,
                tax: order_data.tax,
                content_ids: contents.map(item => item.id),
                contents: contents,
                num_items: contents.reduce((acc, item) => acc + item.quantity, 0),
                content_type: 'product_group',
                // Customer data (optional)
                first_name: user_data.first_name,
                last_name: user_data.last_name,
                email_address: user_data.email_address,
                phone_number: user_data.phone,
                countryCode: user_data.country
            };
            e_g('track', 'Purchase', eg_data);
        } catch (error) {
            console.error("Error capturing purchase data for e_g:", error);
        };
    }
    var confirmation_pages = ['confirm-booking', 'order-confirmation'];
    var reload_flag = window.performance.getEntriesByType('navigation').map(function(nav){ return nav.type }).includes('reload');
    if (confirmation_pages.includes(window.location.pathname.split('/').pop()) && !reload_flag) {
        e_g_purchase();
    }
    window.addEventListener('message', e => {
        if (e.origin !== 'https://joinnow.live') return;
        if(!e.data.email) return;
        e_g('track', 'Lead', {email_address: e.data.email, value: 5, currency: 'USD'});
    });

    function crawlProducts() {
        var nodes = document.querySelectorAll('section.product-detail .product-description');
        var contents = [];
        nodes.forEach(function(node){
            // id: prefer element id, fallback to input value
            var id = node.id || (node.querySelector('input[type=checkbox],input[type=radio]') || {}).value || '';
            var nameEl = node.querySelector('.product-name');
            var name = nameEl ? nameEl.textContent.trim() : '';
            // quantity
            var qtyText = (node.querySelector('.text-center.item') || {}).textContent || '1';
            var quantity = parseInt(qtyText.replace(/\D+/g,''),10) || 1;
            // price
            var priceTextRaw = (node.querySelector('.item-price') || {}).textContent || '';
            var priceNumber = parseFloat((priceTextRaw.match(/[\d,.]+/) || ['0'])[0].replace(/,/g,'')) || 0;

            contents.push({
                id: id,
                quantity: quantity,
                item_price: priceNumber,
            });
        });
        return contents;
    }


    function trackCheckout() {

        if (window.location.pathname.split('/').pop() !== 'checkout') return;
        var product_contents = crawlProducts();
        console.log("Crawled Products:", product_contents);
        if (!product_contents.length) return;
        e_g('track', 'checkout_started', {
            content_type: 'product_group',
            content_name: 'Checkout',
            content_ids: product_contents.map(item => item.id),
            contents: product_contents,
            num_items: product_contents.reduce((acc, item) => acc + item.quantity, 0),
            value: product_contents.reduce((acc, item) => acc + (item.item_price * item.quantity), 0),
            currency: 'USD'
        });
    }
    if (document.readyState === 'complete') {
        setTimeout(trackCheckout, 3000);
    } else {
        window.addEventListener('load', setTimeout(trackCheckout, 3000));
    }
</script>

<script>
  window.addEventListener('edgetag-initialized', function () {
    const sendUser = (user) => {
      if (!user) {
        return;
      }
      Object.entries(user).forEach(([key, value]) => {
        if (!value) {
          delete user[key];
        }
      });
      if (!Object.keys(user).length) {
        return;
      }
      edgetag('data', user);
    };
    if (window.location.href.includes('webinar.drshumardworkshop.com')) {
      try {
        if (sessionStorage.getItem('edgetag_lead_fired') !== 'true') {
          edgetag('tag', 'Lead');
          sessionStorage.setItem('edgetag_lead_fired', true);
        }
      } catch (e) {
        console.error('Error in edgetag lead logic:', e);
      }
    }
    if (window.location.href.includes('checkout')) {
      edgetag('tag', 'InitiateCheckout');
    }
    document.addEventListener(
      'click',
      function (e) {
        let target = e.target;
        if (target.closest('button.form-btn')) {
          let name = document.querySelector('input[name="name"]')?.value || '';
          let email =
            document.querySelector('input[name="email"]')?.value || '';
          let phone =
            document.querySelector('input[name="phone"]')?.value || '';
          let user = {
            email: email,
            phone: phone.replace(/\s+/g, ''),
          };
          if (name) {
            let nameParts = name.split(' ');
            user.firstName = nameParts[0] || '';
            user.lastName = nameParts.slice(1).join(' ') || '';
          }
          sendUser(user);
          let orderTotalElem = document.querySelector(
            '.order-total .item-price'
          );
          let finalPrice = 0;
          if (orderTotalElem) {
            let priceText = orderTotalElem.textContent.replace(/[^0-9.]+/g, '');
            finalPrice = parseFloat(priceText) || 0;
          }
          edgetag('tag', 'AddPaymentInfo', {
            currency: 'USD',
            value: finalPrice,
          });
        }
      },
      true
    );
  });
</script>
